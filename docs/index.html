<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#b7410e" />
<meta name="description" content="毎朝10分でできるRustの練習問題。クイズ・出力予想・バグ探し・リファクタリングをランダムに出題します。" />
<title>🦀 Rust Daily 10min</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%80%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">🦀 <span>Rust Daily 10min</span></div>
    <div class="streak" id="streak" title="連続達成日数"></div>
  </header>

  <main id="main">
    <div class="loading" id="loading">読み込み中...</div>
  </main>

  <footer class="bottombar">
    <button id="shuffleBtn" class="btn ghost">🔀 別の問題</button>
    <button id="doneBtn" class="btn primary">✅ できた！</button>
  </footer>

</div>

<template id="problem-template">
  <article class="card">
    <div class="meta-row">
      <span class="badge category"></span>
      <span class="badge type"></span>
      <span class="difficulty"></span>
      <span class="day"></span>
    </div>
    <h2 class="title"></h2>
    <p class="prompt"></p>
    <pre class="code"><code></code></pre>

    <div class="answer-area">
      <div class="quiz-choices"></div>
      <div class="text-input-area">
        <input type="text" class="text-answer" placeholder="答えを入力（任意）" autocomplete="off" />
      </div>
      <div class="freeform-area">
        <textarea class="freeform-answer" rows="3" placeholder="考えたことをメモ（任意）"></textarea>
      </div>
      <button class="btn reveal">答え・解説を見る</button>
    </div>

    <div class="result hidden">
      <div class="result-banner"></div>
      <div class="solution-block hidden">
        <div class="label">修正例・お手本コード</div>
        <pre class="code solution-code"><code></code></pre>
      </div>
      <div class="explanation-block">
        <div class="label">解説</div>
        <p class="explanation"></p>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
